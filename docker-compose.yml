services:
  db:
    image: postgres:16-alpine
    container_name: healthcompanion_db
    environment:
      POSTGRES_USER: healthcompanion
      POSTGRES_PASSWORD: healthcompanion
      POSTGRES_DB: healthcompanion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcompanion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: healthcompanion_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthcompanion:healthcompanion@db:5432/healthcompanion
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: healthcompanion_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:
  uploads_data:
