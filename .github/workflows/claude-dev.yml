# Feature workflow with Claude Code (agents-hub project template). Copy to .github/workflows/claude-dev.yml.
#
#   1. Open an issue describing the feature and add the label `feature`  → Claude posts a spec on the issue.
#   2. Read it. Want changes? Comment "@claude …" and it revises. Happy? Add the label `approved`.
#   3. Claude implements it on a branch, writes and runs the tests, and opens a PR that closes the issue.
#   4. Claude reviews the PR (and your CI runs). Comment "@claude …" on the PR for fixes. You merge.
#
# Nothing merges or deploys by itself. Only people with write access can trigger it, and only their comments
# (plus Claude's) are passed to Claude. Needs: the Claude GitHub app installed on the repo, and the repo secret
# ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`; then swap the input below).
name: Claude dev

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  COMMENT_AUTHORS: "saffist3r,claude[bot]"

jobs:
  spec:
    if: github.event_name == 'issues' && github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            You are the tech lead of this project. Read the issue (`gh issue view ${{ github.event.issue.number }} --comments`),
            then CLAUDE.md / README / AGENTS.md and the code it touches. Do not change any file.

            Post ONE comment on the issue (`gh issue comment`) with a short implementation spec, in this shape:
            ## Spec
            **Goal**: one or two sentences, in the user's terms.
            **Changes**: bullets per file or module (new endpoints, models, migrations, UI screens…).
            **Tests**: what you will add or update, and the command that runs them.
            **Risks**: data migrations, breaking API changes, security, anything touching payments or personal data.
            **Out of scope**: what you will deliberately not do.
            **Questions**: only if something blocks you; otherwise "None".
            **Size**: S / M / L.
            End with: "Add the `approved` label to build it, or comment `@claude` with changes."
            Keep it tight: the owner reads it on a phone.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(git log:*),Bash(ls:*)"

  build:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'feature')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            The owner approved the spec on this issue. Implement it.
            1. Read the issue and all its comments (`gh issue view ${{ github.event.issue.number }} --comments`). The last
               spec comment, with any changes the owner asked for after it, is what you build. Follow CLAUDE.md and the
               repo's conventions (style, version/CHANGELOG rules, migrations).
            2. Create a branch `claude/issue-${{ github.event.issue.number }}-<short-slug>` from the default branch.
            3. Implement it with tests. Install what you need and run the project's test suite until it passes.
               If something in the spec turns out wrong or impossible, do the closest safe thing and say so in the PR.
            4. Commit with clear messages (no Co-Authored-By or "Generated with" lines), push the branch, and open a PR
               with `gh pr create`: title = the feature; body = what changed, how you tested it (commands + results),
               anything left for the owner (env vars, migrations to run, manual checks), and "Closes #${{ github.event.issue.number }}".
            5. Comment on the issue with the PR link.
            Never push to the default branch, never merge, never deploy, never print or commit secrets.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior engineer who knows this repo (read CLAUDE.md first).
            Only report what matters: bugs, missing edge cases, security or data-loss risks, broken migrations,
            missing or weak tests, and places it doesn't do what the linked issue asked. Use inline comments for
            specific lines. Finish with a short verdict: "Ready to merge", or the list of must-fix items.
            Skip style nitpicks.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Glob,Grep"

  chat:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --append-system-prompt "On an issue with a spec, revise the spec as asked (a new comment). On a PR, make the requested fixes on the PR's branch and run the tests. Never merge, deploy or push to the default branch. No Co-Authored-By or 'Generated with' lines in commits."
