# Weekly product manager with Claude Code (agents-hub project template). Copy to .github/workflows/claude-pm.yml.
#
# Every Monday it reads the repo (code, README, CHANGELOG, TODO, recent commits), its open issues and PRs, then:
#   - files up to 5 new tickets, each with a priority, type and size label and acceptance criteria;
#   - re-prioritises the open tickets it filed earlier (label `pm`) when things changed;
#   - updates one pinned "PM report" issue: status, the ordered backlog, risks.
# It never closes or edits your own tickets, never touches code, and never uses the `feature`/`approved` labels
# (those start the Claude feature workflow: you add them when you want a ticket built).
# Run it by hand: Actions → Claude PM → Run workflow. Needs the Claude GitHub app and ANTHROPIC_API_KEY, like claude-dev.
name: Claude PM

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC (08:00 Paris in summer, 07:00 in winter)
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: what to look at this time (e.g. 'onboarding', 'performance', 'before the v2 launch')"
        required: false
        default: ""

concurrency:
  group: claude-pm
  cancel-in-progress: false

jobs:
  pm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write, pull-requests: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 50 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            TODAY: run date of this workflow (use `date -u +%F`)
            FOCUS FROM THE OWNER: ${{ github.event.inputs.focus || 'none' }}

            You are the product manager of this project for its owner, Safwen, a solo founder who builds several
            products at once and has little time. Your job: keep a short, honest, prioritised backlog as GitHub
            issues, so that each week he knows what matters most here.

            ## 1. Understand the project (read only)
            - README, CLAUDE.md / AGENTS.md, CHANGELOG (latest entries), TODO.md or docs/ roadmaps if present.
            - `git log --since="21 days ago" --stat` for what moved recently.
            - Open issues and PRs: `gh issue list --state open --limit 100 --json number,title,labels,createdAt,updatedAt,body`
              and `gh pr list --state open --json number,title,createdAt`. Also `gh issue list --state closed --limit 30`
              so you don't re-file what was just done.
            - Skim the code where needed to judge a ticket (a TODO/FIXME, a missing test, an obvious bug, a security gap).

            ## 2. File new tickets (at most 5; zero is fine)
            Only file what is worth the owner's time: user-facing value, bugs, security or data-loss risks, things
            blocking growth or releases, tech debt that is actively hurting. No duplicates of open issues (check
            titles and bodies), no vague "improve X", no style nits.
            Each ticket: `gh issue create --title ... --body ... --label pm --label "priority: Px" --label "type: ..." --label "size: ..."`
            - Title: imperative, specific ("Coaches can export a player's report as PDF").
            - Body, in this shape:
              **Why**: the problem or opportunity, with evidence (file:line, commit, issue, metric) in 2-4 lines.
              **What**: the change, in user terms.
              **Acceptance criteria**: 2-5 checkboxes, testable.
              **Notes**: pointers to code, risks, dependencies on other issues (#n).
            - priority: P0 = broken/insecure in production now; P1 = this week, clear value; P2 = soon; P3 = someday.
            - type: feature | bug | security | tech-debt | docs | chore. size: S (hours) | M (a day or two) | L (more; split it if you can).
            Write in English unless the repo's issues are in French.

            ## 3. Re-prioritise your own tickets
            For open issues labelled `pm`, change the priority label if the situation changed, with a one-line comment
            saying why. Never edit the title or body of issues, never close issues, and never touch issues without
            the `pm` label (just take them into account in the report).

            ## 4. Update the PM report
            Find the open issue titled "PM report" with label `pm-report` (create it if missing, then pin it with
            `gh issue pin`). Replace its body (`gh issue edit --body`) with:
            **Updated**: date · **Health**: 🟢/🟡/🔴 and one sentence.
            **Last 3 weeks**: what shipped (from commits/closed issues), 3-6 bullets.
            **Top 5 now**: the ordered backlog across ALL open issues (yours and the owner's), each "#n title (P, size): why now".
            **Risks / blockers**: bullets, or "None".
            **Suggested next**: one sentence: the single thing to do next and why.
            Also add a short comment on that issue listing the tickets you filed or re-prioritised this run.

            Rules: never use the labels `feature` or `approved` (they start the build workflow). Never change code,
            push, open PRs, or close anything. Never put secrets, personal data or customer names in issues (this
            repo may be public).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(date:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue pin:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh label list:*)"
