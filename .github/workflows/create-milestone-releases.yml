name: Create milestone releases
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/create-milestone-releases.yml"
      - ".github/release-notes/**"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create v1.2.0 through v1.5.0 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for ver in 1.2.0 1.3.0 1.4.0 1.5.0; do
            tag="v${ver}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists"
            else
              gh release create "$tag" \
                --title "Health Companion ${tag}" \
                --notes-file ".github/release-notes/${tag}.md"
              echo "Created $tag"
            fi
          done
