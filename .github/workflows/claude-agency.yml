# AI agency on this repo (agents-hub project template). Copy to .github/workflows/claude-agency.yml, with the role
# prompts in .github/agency/*.md. Docs: agents-hub/docs/agency.md.
#
#   daily 05:00 UTC  PM: tickets with priority + due date (P0 now, P1 1 day, P2 3 days, P3 7 days), starts today's work, standup board
#   label feature    Tech lead: spec; auto-approves safe S/M work, otherwise `needs-owner`
#   label approved   Developer: builds on claude/issue-N-…, opens a PR
#   PR opened        QA (tests) → Tech writer (docs) · Code review · Security · UX (UI changes) → Engineering manager verdict
#   changes-requested Developer fixes (2 rounds max), then `agency:recheck` reruns the reviews
#   ready-to-merge   Safwen merges → Release manager drafts the release
#   @claude          answers or acts on a comment from Safwen
#
# Safwen approves risky specs and merges every PR. Nothing merges, tags, publishes or deploys by itself.
# Needs the Claude GitHub app and a CLAUDE_CODE_OAUTH_TOKEN secret (Claude Max/Pro, from `claude setup-token`) or an
# ANTHROPIC_API_KEY secret (API credit); the token wins when both are set. Without either, every job is a no-op.
name: Claude agency

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus for today's PM run (e.g. 'onboarding', 'before the v2 launch')"
        required: false
        default: ""
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, labeled]
  push:
    branches: [main, master]

concurrency:
  group: agency-${{ github.event.issue.number || github.event.pull_request.number || github.event_name }}
  cancel-in-progress: false

env:
  HAS_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
  MODEL: claude-opus-5-5
  MAX_NEW_TICKETS: "5"
  MAX_STARTS: "2"
  WIP_LIMIT: "3"
  BOTS: "claude[bot]"
  COMMENT_AUTHORS: "saffist3r,claude[bot]"
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  # ── Product manager: daily grooming, today's starts, standup ──────────────
  pm:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: read, issues: write, pull-requests: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 100 }
      - id: role
        if: env.HAS_KEY == 'true'
        env: { ROLE: pm }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · TODAY: use `date -u +%F` · MAX_NEW_TICKETS=${{ env.MAX_NEW_TICKETS }} · MAX_STARTS=${{ env.MAX_STARTS }} · WIP_LIMIT=${{ env.WIP_LIMIT }}
            FOCUS FROM SAFWEN: ${{ github.event.inputs.focus || 'none' }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 70
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(date:*),Bash(gh issue:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh label list:*)"

  # ── Tech lead: spec + go/no-go ─────────────────────────────────────────────
  spec:
    if: github.event_name == 'issues' && github.event.label.name == 'feature'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read, issues: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - id: role
        if: env.HAS_KEY == 'true'
        env: { ROLE: tech-lead }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          prompt: |
            REPO: ${{ github.repository }} · ISSUE: ${{ github.event.issue.number }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 35
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(ls:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*)"

  # ── Developer: build ───────────────────────────────────────────────────────
  build:
    if: >-
      github.event_name == 'issues' && github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'feature')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: role
        if: env.HAS_KEY == 'true'
        env: { ROLE: developer }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          prompt: |
            REPO: ${{ github.repository }} · MODE: Build · ISSUE: ${{ github.event.issue.number }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

  # ── Developer: fix what the verdict asked ─────────────────────────────────
  fix:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'changes-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.ref }}" }
      - id: role
        if: env.HAS_KEY == 'true'
        env: { ROLE: developer }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · MODE: Fix · PR: ${{ github.event.pull_request.number }} · BRANCH: ${{ github.event.pull_request.head.ref }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 100
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

  # ── PR review stage (opened / ready / rechecked) ──────────────────────────
  pr-gate:
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
       (github.event.action == 'labeled' && github.event.label.name == 'agency:recheck'))
    runs-on: ubuntu-latest
    permissions: { pull-requests: write }
    outputs:
      run: ${{ steps.g.outputs.run }}
      ui: ${{ steps.g.outputs.ui }}
      ours: ${{ steps.g.outputs.ours }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [ "$HAS_KEY" = true ] && [ "$SAME_REPO" = true ] && echo run=true >> "$GITHUB_OUTPUT"
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "agency:recheck" >/dev/null 2>&1 || true
          case "$HEAD" in claude/*) echo ours=true >> "$GITHUB_OUTPUT";; esac
          if gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only | grep -Eiq '\.(tsx|jsx|vue|svelte|html|css|scss|dart|swift|kt|xml)$|(^|/)(frontend|web|ui|components|pages|screens|locales|i18n|templates)/'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          fi

  qa:
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: read, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.ref }}" }
      - id: role
        env: { ROLE: qa }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }} · BRANCH: ${{ github.event.pull_request.head.ref }} · MAY_PUSH: ${{ needs.pr-gate.outputs.ours == 'true' }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

  docs:
    needs: [pr-gate, qa]
    if: always() && needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ github.event.pull_request.head.ref }}" }
      - id: role
        env: { ROLE: tech-writer }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }} · BRANCH: ${{ github.event.pull_request.head.ref }} · MAY_PUSH: ${{ needs.pr-gate.outputs.ours == 'true' }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"

  code-review:
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: role
        env: { ROLE: code-reviewer }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"

  security:
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: role
        env: { ROLE: security }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"

  ux:
    needs: pr-gate
    if: needs.pr-gate.outputs.run == 'true' && needs.pr-gate.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read, pull-requests: write, issues: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: role
        env: { ROLE: ux }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"

  verdict:
    needs: [pr-gate, qa, docs, code-review, security, ux]
    if: always() && needs.pr-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: write, issues: write, checks: read, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - id: role
        env: { ROLE: eng-manager }
        run: |
          git fetch -q --depth 1 origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          allowed_bots: ${{ env.BOTS }}
          additional_permissions: |
            checks: read
          prompt: |
            REPO: ${{ github.repository }} · PR: ${{ github.event.pull_request.number }}
            Review jobs: QA=${{ needs.qa.result }} DOCS=${{ needs.docs.result }} CODE=${{ needs.code-review.result }} SECURITY=${{ needs.security.result }} UX=${{ needs.ux.result }} (a failed or cancelled job counts as a must-fix: "rerun <role>")

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 25
            --allowedTools "Read,Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*)"

  # ── Release manager: draft release notes after a merge ────────────────────
  release:
    if: >-
      github.event_name == 'push' && github.ref_name == github.event.repository.default_branch &&
      !contains(github.event.head_commit.message, '[skip agency]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: agency-release, cancel-in-progress: true }
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: role
        if: env.HAS_KEY == 'true'
        env: { ROLE: release-manager }
        run: |
          git fetch -q origin "$DEFAULT_BRANCH"
          { echo 'prompt<<AGENCY_EOF'; git show "origin/$DEFAULT_BRANCH:.github/agency/_rules.md"; echo
            git show "origin/$DEFAULT_BRANCH:.github/agency/$ROLE.md"; echo 'AGENCY_EOF'; } >> "$GITHUB_OUTPUT"
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |
            REPO: ${{ github.repository }} · MERGED: ${{ github.sha }}

            ${{ steps.role.outputs.prompt }}
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Bash(git log:*),Bash(git describe:*),Bash(git tag --list:*),Bash(gh release list:*),Bash(gh release view:*),Bash(gh release create:*),Bash(gh release edit:*)"

  # ── @claude from Safwen ────────────────────────────────────────────────────
  chat:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          include_comments_by_actor: ${{ env.COMMENT_AUTHORS }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 100
            --append-system-prompt "You work in this repo's AI agency (roles in .github/agency/). On an issue with a spec, revise the spec as asked in a new comment. On a PR, make the requested changes on the PR's branch, run the tests, then add the label agency:recheck. Never merge, deploy or push to the default branch. No Co-Authored-By or 'Generated with' lines."
