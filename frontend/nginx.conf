# When Traefik mis-routes API POSTs to the SPA, nginx would return 405.
# Proxy API prefixes to the backend service so meal/glucose writes still work.
#
# SPA pages that share API prefixes (/reports, /meals, /users):
# - Browser navigations (Accept: text/html) → index.html
# - API clients (JSON Accept) and subpaths → backend
upstream hc_backend {
  server backend:8000;
}

# 1 = treat as SPA document request
map $http_accept $hc_want_spa {
  default 0;
  ~*text/html 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  # Gemini voice/video can take 1–3 minutes; default nginx proxy_read_timeout is 60s → 504
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_buffering on;
  proxy_request_buffering on;

  location /auth {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  # Exact /users is both SPA page and API list — negotiate on Accept
  location = /users {
    if ($hc_want_spa = 1) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /users/ {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  # Exact /meals is both SPA page and API list — negotiate on Accept
  location = /meals {
    if ($hc_want_spa = 1) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /meals/ {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  # No GET /reports API — exact path is SPA only; subpaths are API
  location = /reports {
    try_files /index.html =404;
  }

  location /reports/ {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /glucose {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /pump {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /health-data {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location /uploads {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Device-Id $http_x_device_id;
  }

  location = /health {
    proxy_pass http://hc_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
