# SPA + reverse proxy to the API.
#
# Current clients call the API under /api/*. The root-level blocks below
# (/auth, /meals, /reports/…) only exist for phone builds released before the
# /api prefix; drop them once every phone runs 1.6+.
upstream hc_backend {
  server backend:8000;
}

# 1 = treat as SPA document request
map $http_accept $hc_want_spa {
  default 0;
  ~*text/html 1;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  # Gemini voice/video can take 1–3 minutes; default nginx proxy_read_timeout is 60s → 504
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  proxy_buffering on;
  proxy_request_buffering on;

  # Inherited by every proxy_pass location below (client headers such as
  # Authorization and X-Device-Id are forwarded by default).
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://hc_backend;
  }

  location = /health { proxy_pass http://hc_backend; }

  # ---- Legacy root API paths (pre-/api phone builds) ----
  location /auth { proxy_pass http://hc_backend; }
  location /glucose { proxy_pass http://hc_backend; }
  location /pump { proxy_pass http://hc_backend; }
  location /health-data { proxy_pass http://hc_backend; }
  location /uploads { proxy_pass http://hc_backend; }
  location /meals/ { proxy_pass http://hc_backend; }
  location /users/ { proxy_pass http://hc_backend; }
  location /reports/ { proxy_pass http://hc_backend; }

  # Exact /meals and /users are both SPA pages and legacy API lists — negotiate on Accept
  location = /meals {
    if ($hc_want_spa = 1) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://hc_backend;
  }

  location = /users {
    if ($hc_want_spa = 1) {
      rewrite ^ /index.html last;
    }
    proxy_pass http://hc_backend;
  }

  location = /reports {
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
