[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Pyflakes + syntax errors + bugbear; FastAPI's Depends()/Query() defaults are idiomatic (B008).
select = ["E9", "F", "B"]
ignore = ["B008", "B904"]
