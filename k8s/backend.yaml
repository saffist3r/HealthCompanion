apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: healthcompanion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: healthcompanion
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: healthcompanion
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: registry-secret
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; do
                echo "Waiting for postgres..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: DATABASE_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: DATABASE_NAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: backend
          image: registry.saffist3r.xyz/healthcompanion-backend:VERSION_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: ADMIN_NAME
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SSL
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: SMTP_SSL
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: REPORT_EMAIL_TO
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: REPORT_EMAIL_TO
                  optional: true
            - name: REPORT_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: REPORT_EMAIL_FROM
                  optional: true
            - name: REPORT_EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: healthcompanion-secrets
                  key: REPORT_EMAIL_FROM_NAME
                  optional: true
            - name: GEMINI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: GEMINI_MODEL
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: UPLOAD_DIR
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: CORS_ORIGINS
            - name: DAILY_CARB_TARGET_G
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: DAILY_CARB_TARGET_G
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: healthcompanion-config
                  key: PUBLIC_URL
                  optional: true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
