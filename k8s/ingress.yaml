# Public URL: https://healthcompanion.saffist3r.xyz
# API routes are at the root (/meals, /reports, …); SPA is /.
# Split into two Ingress objects so Traefik assigns a higher router priority
# to API paths than the SPA catch-all (avoids intermittent 405 from nginx).
#
# SPA pages that share a prefix with the API:
# - Exact /reports,/meals,/users → frontend (SPA HTML)
# - /reports/* API → backend directly (avoids nginx 60s proxy timeout on Gemini TTS)
# - /meals,/users API (exact + subpaths) → frontend nginx with long proxy timeouts
# TLS: create secret healthcompanion-tls (see k8s/README.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcompanion-api-ingress
  namespace: healthcompanion
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - healthcompanion.saffist3r.xyz
      secretName: healthcompanion-tls
  rules:
    - host: healthcompanion.saffist3r.xyz
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Trailing slash: /reports/daily… → API; bare /reports → SPA
          - path: /reports/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /glucose
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /pump
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health-data
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcompanion-ingress
  namespace: healthcompanion
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - healthcompanion.saffist3r.xyz
      secretName: healthcompanion-tls
  rules:
    - host: healthcompanion.saffist3r.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
